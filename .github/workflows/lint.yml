name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          src: backend
          args: check
      - name: Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          src: backend
          args: format --check --diff
