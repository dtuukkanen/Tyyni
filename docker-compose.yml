name: junction2026

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wellbeing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wellbeing}
      POSTGRES_DB: ${POSTGRES_DB:-wellbeing}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Applies Alembic migrations, then exits. Also runs the test suite:
  #   docker compose run --rm migrate pytest
  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wellbeing}:${POSTGRES_PASSWORD:-wellbeing}@db:5432/${POSTGRES_DB:-wellbeing}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  # HTTP API for the frontend: http://localhost:8000/docs. Reloads on edits under backend/app.
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wellbeing}:${POSTGRES_PASSWORD:-wellbeing}@db:5432/${POSTGRES_DB:-wellbeing}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

volumes:
  pgdata:
