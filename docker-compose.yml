name: junction2026

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wellbeing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wellbeing}
      POSTGRES_DB: ${POSTGRES_DB:-wellbeing}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Applies Alembic migrations, then exits. Also runs the test suite:
  #   docker compose run --rm migrate pytest
  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wellbeing}:${POSTGRES_PASSWORD:-wellbeing}@db:5432/${POSTGRES_DB:-wellbeing}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  # Optional DB browser: docker compose --profile tools up -d adminer  ->  http://localhost:8080
  adminer:
    image: adminer:4.8.1
    profiles: ["tools"]
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  pgdata:
